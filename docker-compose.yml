services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/users
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  course-service:
    build:
      context: .
      dockerfile: services/course-service/Dockerfile
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: courses
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      mongo:
        condition: service_healthy

  enrollment-service:
    build:
      context: .
      dockerfile: services/enrollment-service/Dockerfile
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/enrollments
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COURSE_SERVICE_URL: http://course-service:8000
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      course-service:
        condition: service_started

  progress-service:
    build:
      context: .
      dockerfile: services/progress-service/Dockerfile
    ports:
      - "127.0.0.1:8004:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: progress
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COURSE_SERVICE_URL: http://course-service:8000
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      course-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "127.0.0.1:8005:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notifications
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: ./services/gateway
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - user-service
      - course-service
      - enrollment-service
      - progress-service
      - notification-service

volumes:
  pgdata:
  mongodata:
  rabbitdata:
