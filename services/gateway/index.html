<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>LearnHub</title>
  <link rel="stylesheet" href="/styles.css?v=2">
  <script src="/app.js?v=2" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" data-link><span class="brand-mark">L</span> LearnHub</a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="/" data-link data-nav="/">Home</a>
      <a href="/courses" data-link data-nav="/courses">Courses</a>
      <a href="/enrollments" data-link data-nav="/enrollments">My learning</a>
      <a href="/progress" data-link data-nav="/progress">Progress</a>
      <a href="/notifications" data-link data-nav="/notifications">Notifications</a>
    </nav>
    <div class="account-area" id="account-area"></div>
  </header>
  <main id="app" class="page-shell" tabindex="-1">
    <section class="loading-card"><span class="spinner"></span> Connecting to LearnHub services...</section>
  </main>
  <footer class="site-footer">
    <span>LearnHub <span aria-hidden="true">·</span> Learn something new, one lesson at a time.</span>
    <a href="/courses" data-link>Explore the catalog</a>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
