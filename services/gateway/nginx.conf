events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;

    map $service_name $service_upstream {
        default "";
        user-service user-service:8000;
        course-service course-service:8000;
        enrollment-service enrollment-service:8000;
        progress-service progress-service:8000;
        notification-service notification-service:8000;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ ^/service-health/(?<service_name>user-service|course-service|enrollment-service|progress-service|notification-service)/(?<probe_name>healthz|readyz)$ {
            proxy_pass http://$service_upstream/$probe_name;
        }

        location = /api/users {
            return 308 /api/users/;
        }

        location /api/users/ {
            set $learnhub_upstream user-service:8000;
            rewrite ^/api/users/(.*)$ /users/$1 break;
            proxy_pass http://$learnhub_upstream;
        }

        location = /api/courses {
            set $learnhub_upstream course-service:8000;
            rewrite ^ /courses break;
            proxy_pass http://$learnhub_upstream;
        }

        location /api/courses/ {
            set $learnhub_upstream course-service:8000;
            rewrite ^/api/courses/(.*)$ /courses/$1 break;
            proxy_pass http://$learnhub_upstream;
        }

        location = /api/enrollments {
            set $learnhub_upstream enrollment-service:8000;
            rewrite ^ /enrollments break;
            proxy_pass http://$learnhub_upstream;
        }

        location /api/enrollments/ {
            set $learnhub_upstream enrollment-service:8000;
            rewrite ^/api/enrollments/(.*)$ /enrollments/$1 break;
            proxy_pass http://$learnhub_upstream;
        }

        location /api/progress/ {
            set $learnhub_upstream progress-service:8000;
            rewrite ^/api/progress/(.*)$ /progress/$1 break;
            proxy_pass http://$learnhub_upstream;
        }

        location = /api/progress {
            set $learnhub_upstream progress-service:8000;
            rewrite ^ /progress break;
            proxy_pass http://$learnhub_upstream;
        }

        location = /api/notifications {
            set $learnhub_upstream notification-service:8000;
            rewrite ^ /notifications break;
            proxy_pass http://$learnhub_upstream;
        }

        location /api/notifications/ {
            set $learnhub_upstream notification-service:8000;
            rewrite ^/api/notifications/(.*)$ /notifications/$1 break;
            proxy_pass http://$learnhub_upstream;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
